<!-- /upnext/ phone, beat 6: Cookie time, the end of six weeks. 1080x1920 (405x720 dp at 2.667, the same frame
     as the Note to Self screens, which come from wcn-sparkmobile docs/store/2.0/src/build.py, Android set).
     Not an app screenshot: the screen is designed, not built (wcn-sparkmobile 2.0.2 mocks, screen 12), so the

       chrome-headless-shell --headless --use-mock-keychain --hide-scrollbars --force-device-scale-factor=1 \

  .frame{width:405px;height:720px;transform:scale(2.6667);transform-origin:top left;background:#0E1A2B;color:#F4EFE6;

  .card .s{font-size:13px;color:#C9C3BC}
  .wks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
  .wks div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#C9C3BC;font-weight:700}
  .wks i{width:30px;height:30px;border-radius:15px;background:#49A078;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:11px;font-weight:900}
  .wks div:last-child i{background:#FFCD00;color:#0E1A2B}
  .foot{padding:8px 24px 6px;display:flex;flex-direction:column;gap:2px}
  .btn{background:#DA251D;border-radius:999px;padding:15px;text-align:center;font-size:18px;font-weight:800;color:#fff}
  .ghost{padding:10px;text-align:center;font-size:15px;font-weight:700;color:#FFCD00}
  .homebar{height:24px;display:flex;justify-content:center;align-items:center}
  .homebar i{display:block;width:108px;height:4px;border-radius:3px;background:#F4EFE6;opacity:.45}
