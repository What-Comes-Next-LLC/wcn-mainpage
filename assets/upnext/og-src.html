<!doctype html>
<!-- OG card for /upnext/, 1200x630. Render with Playwright to assets/upnext/upnext-og-2026-10.png
     (wcn-pressroom/og-src/shoot.js shows the 15-line way). Dated filename: social caches key on URL. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Raleway; src: url(../fonts/raleway-latin-var.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #216869; color: #f4f4f4; font-family: Raleway, sans-serif; }
  .eb { position: absolute; left: 80px; top: 96px; font-size: 20px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(244,244,244,0.82); }
  h1 { position: absolute; left: 80px; top: 142px; width: 680px; margin: 0; font-weight: 200; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 80px; top: 470px; width: 640px; font-size: 27px; font-weight: 300; color: rgba(244,244,244,0.82); line-height: 1.35; }
  .glow { position: absolute; left: 700px; top: 40px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(231,111,81,0.30), rgba(231,111,81,0) 62%); }
  svg[data-splat] { position: absolute; left: 790px; top: 125px; width: 380px; height: 380px; overflow: visible; filter: drop-shadow(0 18px 30px rgba(14,22,20,0.35)); }
  .wm { position: absolute; right: 64px; bottom: 44px; font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,244,244,0.6); }
</style>
<body>
<div class="eb">What Comes Next? LLC &middot; Up next</div>
<h1>Evolutions, one app at a time.</h1>
<div class="sub">The method as a loop. Click around.</div>
<div class="glow"></div>
<svg data-splat viewBox="-50 -50 100 100"></svg>
<div class="wm">whatcomesnextllc.ai/upnext</div>
<script src="splat-v1.js"></script>
</body>
