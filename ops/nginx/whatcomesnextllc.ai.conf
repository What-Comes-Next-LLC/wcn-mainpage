# ═══════════════════════════════════════════════════════════════════════════════
# REFERENCE CAPTURE of /etc/nginx/sites-available/whatcomesnextllc.ai on wcn-vps2.
# Captured 2026-08-26. NEVER DEPLOYED FROM HERE — same rule as wcn-intake/ops/nginx
# and wcn-ilbtyd/ops/nginx: a bad nginx config takes down every site on the box, so
# vhost changes are made deliberately on the box, with `nginx -t` before reload.
#
# WHY THIS FILE DID NOT EXIST UNTIL NOW
# Every other vhost in the fleet has a capture — 6ix2success and wawawednesday and
# wcn-admin in wcn-intake, ilookbetterthanyourdad in wcn-ilbtyd, calendar in
# wcn-calendar. The apex had none, because it was configured BEFORE that convention
# existed; the convention came out of the wcn-intake nginx work and was never
# applied backwards. This closes the gap.
#
# It lives in wcn-mainpage rather than wcn-intake because wcn-mainpage owns the apex
# site: the webroot below is a git clone of THIS repo. The brand ingresses
# (wawawednesday, 6ix2success) are wcn-intake's, and their captures stay there.
#
# When you change the live vhost, re-capture it here in the same commit. A stale
# capture is worse than none — it invites someone to trust it.
# ═══════════════════════════════════════════════════════════════════════════════

# HTTP: ACME challenges + redirect to HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name whatcomesnextllc.ai www.whatcomesnextllc.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://whatcomesnextllc.ai$request_uri;
    }
}

# HTTPS www → apex redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.whatcomesnextllc.ai;

    ssl_certificate     /etc/letsencrypt/live/whatcomesnextllc.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatcomesnextllc.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://whatcomesnextllc.ai$request_uri;
}

# HTTPS apex — production site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whatcomesnextllc.ai;

    ssl_certificate     /etc/letsencrypt/live/whatcomesnextllc.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatcomesnextllc.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/whatcomesnextllc.ai;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # The calendar moved to its own subdomain and its own repo (2026-08-17). This
    # path served a real page until then, so it gets a redirect rather than a 404 —
    # and it needs to be explicit, because the try_files below would otherwise hand
    # back the homepage with a 200 and quietly pretend nothing moved.
    location = /calendar  { return 301 https://calendar.whatcomesnextllc.ai/; }
    location = /calendar/ { return 301 https://calendar.whatcomesnextllc.ai/; }

    # The Spark web funnel was retired 2026-08-26. The study enrols through its own
    # path now (the printed card, 6ix2success, a direct Qualtrics link), so the funnel
    # had no remaining job — and every visit to it called the Catalyst API on
    # laundryroom, which is being reserved for experiment traffic.
    #
    # Explicit and exact, for the same reason /calendar above is: spark.html is still
    # a real file in this webroot (deployed from wcn-intake), so `try_files` in
    # `location /` would happily serve it with a 200. An `location =` exact match wins
    # over the prefix match regardless of order, so this shadows the file.
    #
    # The file is deliberately left on disk rather than deleted: wcn-intake's deploy.sh
    # still ships it and verifies its checksum, and leaving it means this is one line
    # away from being reversible.
    #
    # /go/spark on the ILBTYD vhost still 302s here. That is intentional and stays —
    # it is how a tagged campaign click gets logged on that vhost before handing off.
    # It now lands on the contact form, which is the correct destination for it.
    location = /spark.html { return 301 https://whatcomesnextllc.ai/#contact; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The pitch deck was retired 2026-08-29 and archived to
    # wcn-projectdocsarchive/pitch-deck-2026-08/. WCN has products and no customers —
    # it is a solopreneurship, not an investment opportunity — and a posted deck said
    # otherwise on every load.
    #
    # These 301 to #contact rather than to the tip jar at #support on purpose. Investor
    # inquiries are still welcome; they just go through the contact form now, which has
    # kept its "Investor inquiry" option. Anyone following a deck link still circulating
    # on LinkedIn lands on a person, not a checkout button. The tip jar is one nav click
    # away from there.
    #
    # Same pattern as the /spark.html retirement above. Both files are deleted from the
    # repo, so dropping these blocks would 404 rather than fall through to anything.
    location = /invest { return 301 https://whatcomesnextllc.ai/#contact; }
    location = /deck   { return 301 https://whatcomesnextllc.ai/#contact; }

    location = /brandkit-4w9r.html {
        auth_basic "WCN Brand Kit";
        auth_basic_user_file /etc/nginx/wcn-team.htpasswd;
    }
}
